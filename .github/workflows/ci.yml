name: CI

# Everything `/verify` runs, plus the one check it cannot: that the migrations still apply
# to Postgres, which is what production runs on (see `docs/DEPLOY.md`).
on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `pyproject.toml` asks for >=3.12; pin the floor so CI cannot pass on a newer runtime
  # than the deployment gets.
  PYTHON_VERSION: '3.12'
  # Vite 8 and ESLint 10 both want >=20.19/22.13. The repo pins no version of its own.
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev
        env:
          UV_PYTHON: ${{ env.PYTHON_VERSION }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src api

      - name: Tests
        run: uv run pytest

  migrations:
    name: Migrations on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zzz
          POSTGRES_PASSWORD: zzz
          POSTGRES_DB: zzz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zzz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZZZ_DATABASE_URL: postgresql://zzz:zzz@127.0.0.1:5432/zzz
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev
        env:
          UV_PYTHON: ${{ env.PYTHON_VERSION }}

      - name: Upgrade to head
        run: uv run alembic upgrade head

      # A migration that drifted from `storage/models.py` is the failure that only shows up
      # once the deployment is already live against the real database.
      - name: No drift against the models
        run: uv run alembic check

      - name: Downgrade back to base
        run: uv run alembic downgrade base

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` is `tsc -b && vite build`, so this is the type-check too.
      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

  extension:
    name: Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` is `tsc --noEmit && wxt build`.
      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
