[project]
name = "zzz-tracker"
version = "0.1.0"
description = "Zenless Zone Zero account tracker: account info, agent builds and team comps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "typer>=0.27.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
zzz-tracker = "zzz_tracker.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
# Ruff also formats the python blocks inside markdown. The docs quote code that is meant to
# read the way it was written — snippets from other projects, `.claude/rules` examples in
# another style — so the formatter stays on the code that actually runs.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
